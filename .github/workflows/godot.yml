name: Godot CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

# The checks only read the repository; the pictures job asks for what it
# needs on top (PIX-275).
permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  godot:
    runs-on: ubuntu-latest
    # A stuck run is killed by flows.sh's watchdog; this is the backstop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A release is whole (PIX-274): the README's "Currently vX.Y" is the
      # newest changelog entry's, every release's codename and notes have
      # their French in fr.po, and the French has U+202F, not a plain or
      # no-break space, before : ; ! ? and inside « ». First, before Godot:
      # it takes a second. The release script's own tests run with it.
      - name: Release script tests
        run: python3 -m unittest discover -s godot/tools -p 'test_*.py'

      - name: Release is whole
        run: python3 godot/tools/release.py --check

      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Install web export templates
        run: |
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TDIR/web_nothreads_release.zip" ]; then
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
            unzip -q templates.tpz 'templates/web_*'
            mkdir -p "$TDIR"
            mv templates/web_* "$TDIR/"
          fi

      # The paid art (PIX-133, PIX-138), as the deploy fetches it: proves the
      # deploy key works before main does. Forks have no key and build on
      # Shade's CC0 art alone.
      - name: Fetch the private art
        id: art
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: TomKlotzPro/pixelheim-assets
          ssh-key: ${{ secrets.PIXELHEIM_ASSETS_KEY }}
          path: private-assets
      - name: Install the private art
        if: steps.art.outcome == 'success'
        run: |
          bash scripts/fetch-private-art.sh private-assets
          rm -rf private-assets

      # The import (PIX-271), kept between runs: the job's time goes to the
      # checks. A pull request's run restores only what its own branch or
      # main saved, so the deploy keeps main's (deploy.yml) and this falls
      # back on the newest one there: Godot then imports only the files that
      # changed since (it compares each one's hash). The paid art's .import
      # files sit beside it, git-ignored, so they're kept too, or all of it
      # would import again. With or without the paid art, apart. The paths
      # must stay the same as deploy.yml's: a cache restores only into the
      # paths it was saved from.
      - name: Restore the import
        id: import
        uses: actions/cache/restore@v4
        with:
          path: |
            godot/.godot
            godot/assets/puny/shade/**/*.import
            godot/assets/puny/medieval/*.import
          key: godot-import-${{ env.GODOT_VERSION }}-art-${{ steps.art.outcome }}-${{ hashFiles('godot/project.godot', 'godot/*.import', 'godot/assets/**', 'godot/addons/**', 'godot/locale/**', 'godot/scenes/**', 'godot/scripts/**', 'godot/shaders/**', 'godot/test/**') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-art-${{ steps.art.outcome }}-

      - name: Import assets
        run: godot --headless --path godot --import

      - name: Save the import
        if: steps.import.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            godot/.godot
            godot/assets/puny/shade/**/*.import
            godot/assets/puny/medieval/*.import
          key: ${{ steps.import.outputs.cache-primary-key }}

      - name: Unit tests (GUT)
        # GUT skips a test script that fails to parse and still exits 0, so a
        # typo would silently drop a whole suite: fail the job on it instead.
        run: |
          godot --headless --path godot -s res://addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          status=${PIPESTATUS[0]}
          if grep -qE "Parse Error|Failed to load script" gut.log; then
            echo "::error::a GUT test script failed to load"
            exit 1
          fi
          exit $status

      - name: Translation catalogue is current
        # Every string a player reads is in godot/locale/messages.pot (PIX-195).
        run: python3 godot/tools/i18n.py --check

      - name: Export web build
        run: |
          mkdir -p godot/export/web
          godot --headless --path godot --export-release Web export/web/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/export/web
          retention-days: 7

      # Every map booted headless, by day and at night (PIX-270): GUT never
      # loads the world's scripts, so a script that breaks only there fails
      # here. It runs on Shade's CC0 art too, as the game must.
      - name: Boot every map
        run: bash godot/tools/flows.sh --boot -j "$(nproc)"

      # The release flows (PIX-271), headless, as many at once as the runner
      # has cores; each result goes to the job's summary. A fork's pull
      # request gets no deploy key: its flows run on Shade's CC0 art alone,
      # which every flow passes too (what blocks the way comes from the
      # maps, not the art), and the summary says so.
      - name: Release flows
        env:
          ART: ${{ steps.art.outcome }}
        run: |
          if [ "$ART" != success ]; then
            echo "::notice title=No paid art::This run has no deploy key for the paid art (a fork's pull request): the flows run on Shade's CC0 art alone."
            echo "_No paid art on this run (a fork's pull request): the flows ran on Shade's CC0 art alone._" >> "$GITHUB_STEP_SUMMARY"
          fi
          bash godot/tools/flows.sh --quiet -j "$(nproc)"

      - name: Keep the failed runs' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flows-output
          path: |
            godot/flows/runs/
            godot/flows/boot/
          retention-days: 7


  # The windowed checks (PIX-275): what needs a real window - the motion
  # flow (it measures the hero's pixels frame by frame) and the pictures -
  # beside the godot job, so a visual change is reviewed without a window
  # on the Mac. A virtual display (xvfb) and Mesa's software rendering: the
  # flows on the desktop renderer as on the Mac (Forward+ on lavapipe, the
  # app's look), the look book on the browser's (Compatibility on
  # llvmpipe), as lookbook.sh shoots it. On Shade's CC0 art alone, always:
  # this repository is public, and so are its artifacts to anyone signed in
  # to GitHub, so the paid art is never fetched here nor pictured (no deploy
  # key, and not the godot job's import either: its paid art's imports
  # would draw it). A fresh import of the free art takes seconds.
  #
  # The flows in two shares side by side (PIX-276; flows.sh --shard), each
  # its own runner, the look book with the second; the pictures job below
  # puts their pictures on one sheet and links them in one comment.
  windowed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2]
    env:
      SCREEN: "-screen 0 2560x1440x24"
      # Software rendering on a slow runner: the watchdog, a backstop for a
      # run that never quits, waits longer than on a machine with a GPU.
      FLOWS_WATCHDOG: "150"
      SHARE: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@v4

      # Main's Godot, as the deploy keeps it; only restored here, never saved:
      # a save under that key without the web templates would cost the godot
      # job their download on every run.
      - name: Restore the Godot binary
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Install a virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 >/dev/null

      - name: Import assets (Shade's CC0 art only)
        run: |
          if [ -e godot/assets/puny/medieval ] || [ -e godot/assets/puny/shade ]; then
            echo "::error::the paid art is here, and these pictures are public"
            exit 1
          fi
          godot --headless --path godot --import

      # This share's release flows in a window, each leaving its picture,
      # the motion flow among them. Stepped as every flow is (PIX-276:
      # flows.sh gives Godot --fixed-fps), a few frames a second of software
      # rendering live the same seconds as the godot job's headless runs, so
      # every report must show what its flow expects here too: a flow that
      # differs in a window fails the job, the motion flow's steps back too.
      - name: Release flows, windowed
        run: |
          set +e
          GITHUB_ACTIONS= GITHUB_STEP_SUMMARY= xvfb-run -a -s "$SCREEN" bash godot/tools/flows.sh --shard "$SHARE/2" -j "$(nproc)" > "windowed-$SHARE.txt" 2>&1
          status=$?
          cat "windowed-$SHARE.txt"
          ran=$(grep -E "^Release flows:" "windowed-$SHARE.txt" | sed -E 's/^Release flows: //')
          echo "**Release flows, windowed, share $SHARE of 2:** ${ran:-no result}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAIL " "windowed-$SHARE.txt" | while read -r _ name _ why; do
            echo "::error title=flow $name failed in a window::$why"
            echo "- **$name** failed: $why" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Look book
        if: matrix.share == 2 && (success() || failure())
        run: xvfb-run -a -s "$SCREEN" bash godot/tools/lookbook.sh

      # Every picture, each run's result and output, for the pictures job.
      - name: Upload this share's pictures
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-share-${{ matrix.share }}
          path: |
            windowed-${{ matrix.share }}.txt
            godot/flows/*.png
            godot/flows/runs/*/result
            godot/flows/runs/*/output.txt
            godot/flows/runs/*/shot.png
            godot/lookbook/
          retention-days: 7

  # The two shares' pictures on one contact sheet, the look book's beside
  # it, linked from the run's summary and one comment on the pull request;
  # passes when both shares did.
  pictures:
    needs: windowed
    if: success() || failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The one comment on the pull request linking its pictures.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pil >/dev/null

      - name: The shares' pictures
        uses: actions/download-artifact@v4
        with:
          pattern: pictures-share-*
          merge-multiple: true

      - name: Contact sheets
        run: |
          mkdir -p pictures
          python3 godot/tools/flows_sheet.py godot/flows pictures/flows-sheet.png
          if [ -f godot/lookbook/sheet.png ]; then
            cp godot/lookbook/sheet.png pictures/lookbook-sheet.png
          fi

      - name: Upload every picture
        id: zip
        uses: actions/upload-artifact@v4
        with:
          name: pictures
          path: |
            godot/flows/*.png
            godot/flows/runs/*/shot.png
            godot/lookbook/
          retention-days: 14

      # The sheets on their own, unzipped: a link opens the picture.
      - name: Upload the flows' sheet
        id: flows_sheet
        uses: actions/upload-artifact@v7
        with:
          path: pictures/flows-sheet.png
          archive: false
          retention-days: 14

      - name: Upload the look book's sheet
        id: look_sheet
        if: hashFiles('pictures/lookbook-sheet.png') != ''
        uses: actions/upload-artifact@v7
        with:
          path: pictures/lookbook-sheet.png
          archive: false
          retention-days: 14

      # The links in the job's summary and in one comment on the pull
      # request, edited on each run (a fork's token can't comment).
      - name: Link the pictures
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZIP: ${{ steps.zip.outputs.artifact-url }}
          FLOWS_SHEET: ${{ steps.flows_sheet.outputs.artifact-url }}
          LOOK_SHEET: ${{ steps.look_sheet.outputs.artifact-url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- pixelheim-pictures -->"
          failed=$(cat windowed-*.txt 2>/dev/null | grep -E "^FAIL " | awk '{print $2}' | paste -sd, - | sed 's/,/, /g')
          motion=$(cat windowed-*.txt 2>/dev/null | grep -E "^(ok|FAIL) +motion " | grep -oE "backsteps=[^ ]*" | head -1)
          look=""
          if [ -n "$LOOK_SHEET" ]; then
            look="[the look book's sheet]($LOOK_SHEET), "
          fi
          walked=""
          if [ -n "$motion" ]; then
            walked="; the motion flow walked with $motion"
          fi
          {
            echo "$marker"
            echo "**Pictures of ${SHA:0:7}** ([the run]($RUN)): [every flow on one sheet]($FLOWS_SHEET), $look[every picture at full size]($ZIP) (a zip)."
            echo
            if [ -n "$failed" ]; then
              echo "**Failed in a window:** $failed (their pictures are on the sheet, named in red)."
            else
              echo "Every flow showed in a window what it shows headless$walked."
            fi
            echo
            echo "_Shade's CC0 art only (none of the paid houses, props, rooms or icons), drawn in a virtual display by software: the flows on the desktop renderer, the look book on the browser's._"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PR" ] || [ "$FORK" = true ]; then
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1 || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

      - name: Both shares passed
        if: needs.windowed.result != 'success'
        run: |
          echo "::error::a windowed share failed (${{ needs.windowed.result }}): see its job"
          exit 1
