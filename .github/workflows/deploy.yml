name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - name: Balance regression (all roles must finish the game)
        run: pnpm sim --check
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      # The site (PIX-129): the Godot build at the root, the web game as the
      # classic edition at /classic/ (same origin, so the Godot build can
      # still bring a web hero across), and old /godot/ links forwarding to
      # the root. The single-threaded export needs no special headers.
      - name: Build the classic web edition
        run: pnpm exec vite build --outDir site/classic
        env:
          VITE_BASE: /pixelheim/classic/
      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-4.7.1
      - name: Install Godot + web export templates
        run: |
          GODOT_VERSION="4.7.1"
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          fi
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TDIR/web_nothreads_release.zip" ]; then
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
            unzip -q templates.tpz 'templates/web_*'
            mkdir -p "$TDIR"
            mv templates/web_* "$TDIR/"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
      # Paid art (PIX-133) lives in the private pixelheim-assets repo, read
      # with a deploy key; it goes into the build, never into this repo.
      - name: Fetch the private art
        uses: actions/checkout@v4
        with:
          repository: TomKlotzPro/pixelheim-assets
          ssh-key: ${{ secrets.PIXELHEIM_ASSETS_KEY }}
          path: private-assets
      - name: Install the private art
        run: |
          mkdir -p godot/assets/puny/medieval
          cp private-assets/puny-world-medieval/punyworld-atlas.png godot/assets/puny/medieval/
          rm -rf private-assets
      - name: Build the Godot web export at the site root
        run: |
          godot --headless --path godot --import
          mkdir -p godot/export/web
          godot --headless --path godot --export-release Web export/web/index.html
          cp -R godot/export/web/. site/
          mkdir -p site/godot
          cat > site/godot/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Pixelheim</title>
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="../">
          <p>Pixelheim has moved to <a href="../">its home</a>.</p>
          HTML
      # Publishes to the gh-pages branch root; PR previews live under
      # pr-preview/ and must survive production deploys.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
