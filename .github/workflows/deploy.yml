name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-4.7.1
      - name: Install Godot + web export templates
        run: |
          GODOT_VERSION="4.7.1"
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          fi
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TDIR/web_nothreads_release.zip" ]; then
            curl -sL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
            unzip -q templates.tpz 'templates/web_*'
            mkdir -p "$TDIR"
            mv templates/web_* "$TDIR/"
          fi
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
      # Paid art (PIX-133, PIX-138) lives in the private pixelheim-assets repo, read
      # with a deploy key; it goes into the build, never into this repo.
      - name: Fetch the private art
        uses: actions/checkout@v4
        with:
          repository: TomKlotzPro/pixelheim-assets
          ssh-key: ${{ secrets.PIXELHEIM_ASSETS_KEY }}
          path: private-assets
      - name: Install the private art
        run: |
          bash scripts/fetch-private-art.sh private-assets
          rm -rf private-assets
      - name: Build the Godot web export at the site root
        run: |
          godot --headless --path godot --import
          # The unit tests gate the deploy (GUT exits 0 on a script that fails
          # to parse, so that fails it too).
          godot --headless --path godot -s res://addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] || grep -qE "Parse Error|Failed to load script" gut.log; then
            echo "::error::unit tests failed"
            exit 1
          fi
          mkdir -p godot/export/web
          godot --headless --path godot --export-release Web export/web/index.html
          mkdir -p site
          cp -R godot/export/web/. site/
          # Old links: /godot/ (the beta) and /classic/ (the retired web
          # edition, whose saves the game still imports) lead home.
          for old in godot classic; do
            mkdir -p "site/$old"
            cat > "site/$old/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Pixelheim</title>
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="../">
          <p>Pixelheim lives at <a href="../">its home</a> now; your heroes come with you.</p>
          HTML
          done
      # Publishes to the gh-pages branch root; PR previews live under
      # pr-preview/ and must survive production deploys.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      # Main's import, for the pull requests' checks (godot.yml, PIX-271): a
      # pull request's run can restore a cache saved on main but not one saved
      # on another pull request, and this job imports on every push to main.
      # After the deploy, and never failing it. The paths are godot.yml's.
      - name: Keep the import for pull requests
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            godot/.godot
            godot/assets/puny/shade/**/*.import
            godot/assets/puny/medieval/*.import
          key: godot-import-4.7.1-art-success-${{ github.sha }}
