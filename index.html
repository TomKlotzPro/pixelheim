		<!--
		The web build's page (PIX-296, PIX-517), Godot's own shell with the
		game's loading screen in it: the title's night (assets/splash.png,
		drawn by tools/splash.py, which the export copies beside this page)
		over the same night colour from the first instant, alive while the
		game downloads - stars twinkling, the lake shimmering, windows and
		torches flickering, smoke from the chimneys, the Ashen Mountain
		smoking with embers and, now and then, a far flash of Fafnyr's fire.
		The progress is the courier walking the road with a lantern, lighting
		the road's ember lamps as the bytes arrive, the count over their head;
		a line of the world under the name, a new one every few seconds,
		English or French by the browser's language (the game's body font
		cut into pixels by splash.py: the page loads nothing but itself and
		the picture). A line that stops moving says so honestly; a failure
		leaves a notice with a way to try again. Reduced motion keeps it
		still but for the progress. The game says when its first screen is up
		(world.gd calls window.pixelheimShown), and the page fades as the
		title rises out of the same picture.
		-->
		<link rel="preload" href="index.png" as="image">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #000000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	z-index: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: #000000;
	pointer-events: none;
	transition: opacity 0.45s ease;
}

#status.leaving {
	opacity: 0;
}

#status-stage {
	position: relative;
	width: min(100vw, calc(100vh * 16 / 9));
	aspect-ratio: 16 / 9;
	/* The picture's night until the picture is there; round it, black bars
	   like the game's own canvas on a window of another shape. */
	background-color: #080c28;
}

#status-stage img, #status-stage canvas {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	image-rendering: crisp-edges;
	image-rendering: pixelated;
	/* The picture and its life come out of the night once it has arrived
	   (a moment on a slow line), not drawn half in. */
	opacity: 0;
	transition: opacity 0.35s ease;
}

#status-stage.arrived img, #status-stage.arrived canvas {
	opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
	#status-stage img, #status-stage canvas, #status {
		transition: none;
	}
}

/* The failure notice: plain, in the night's colours, should the page's life
   itself have failed... */
#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	box-sizing: border-box;
	max-width: 80%;
	pointer-events: auto;
	background-color: #1c120a;
	border: 2px solid #f2c14e;
	color: #f3e6c4;
	font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace;
	padding: 1rem 1.5rem;
	text-align: center;
	z-index: 2;
}

#status-notice p {
	margin: 0 0 0.5rem;
}

#status-notice a {
	color: #f2c14e;
}

#status-notice small {
	display: block;
	margin-top: 0.5rem;
	color: #c9b48a;
	white-space: pre-line;
}

/* ...and otherwise drawn on the canvas in the game's pixels: its words stay
   here for a reader and its link for a click, unseen over the drawn ones. */
#status-notice.drawn {
	inset: 0;
	transform: none;
	max-width: none;
	background: none;
	border: 0;
	padding: 0;
	color: transparent;
	pointer-events: none;
}

#status-notice.drawn p, #status-notice.drawn small {
	position: absolute;
	width: 1px;
	height: 1px;
	overflow: hidden;
	clip-path: inset(50%);
}

#status-notice.drawn a {
	position: absolute;
	color: transparent;
	pointer-events: auto;
}

#status-notice.drawn a:focus-visible {
	outline: 2px solid #f2c14e;
}

		const sprite = document.createElement('canvas');
		sprite.width = sprite.height = radius * 2;
		const ink = sprite.getContext('2d');
		for (let y = 0; y < radius * 2; y++) {
			for (let x = 0; x < radius * 2; x++) {
				const d = Math.hypot(x + 0.5 - radius, y + 0.5 - radius) / radius;
				if (d >= 1) {
					continue;
				}
				const level = Math.ceil((1 - d) * steps) / steps;
				ink.fillStyle = 'rgba(' + rgb + ',' + (peak * level * level) + ')';
				ink.fillRect(x, y, 1, 1);

	function fitted(text, most) {

	// Writes `text` on the words' canvas at the picture's (x, y), `align` of
	// its width left of x (0.5 centres it), over its own night shadow.

		const at = Math.round(road.from + (road.to - road.from) * shown);
		const walking = !still && clock - walkedAt < 0.3;
		const pose = walking ? (Math.floor(at / 4) % 2 === 0 ? 'stride' : 'pass') : 'stand';

		// courier's head.

			words.height = Math.round(across * H / W);
		}

			const under = retry ? 44 : 27;
			const high = under + 2 + 14 * failed.length;
